<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Vibrant Primary Gradient (Indigo to Cyan) -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Neon Border Frame -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Background Tech Grid / Radial Lines -->
  <g opacity="0.15" stroke="#818cf8" stroke-width="1.5">
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="130" fill="none" />
    <line x1="256" y1="56" x2="256" y2="456" stroke-dasharray="6 6" />
    <line x1="56" y1="256" x2="456" y2="256" stroke-dasharray="6 6" />
  </g>

  <!-- Quest Beacon Shield / Hexagon -->
  <g filter="url(#soft-shadow)">
    <!-- Hexagonal Quest Badge Background -->
    <path d="M 256 90 L 390 168 L 390 324 L 256 402 L 122 324 L 122 168 Z" 
          fill="#1e1b4b" 
          stroke="url(#primary-grad)" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Inner Glowing Core Path -->
    <path d="M 256 120 L 360 180 L 360 302 L 256 362 L 152 302 L 152 180 Z" 
          fill="url(#bg-grad)" 
          opacity="0.85" />
  </g>

  <!-- Dynamic Energy Lightning / Compass Core -->
  <g filter="url(#glow)">
    <!-- Central Lightning Bolt / Quest Compass Needle -->
    <path d="M 276 150 L 196 266 L 252 266 L 236 362 L 316 246 L 260 246 Z" 
          fill="url(#accent-grad)" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linejoin="round" />
  </g>

  <!-- Modern ENISo Typography Badge at Bottom -->
  <g filter="url(#soft-shadow)">
    <rect x="176" y="380" width="160" height="34" rx="17" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="2" />
    <text x="256" y="403" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-size="16" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle">ENISO</text>
  </g>

  <!-- Corner Tech Accent Dots -->
  <circle cx="256" cy="66" r="5" fill="#38bdf8" />
  <circle cx="446" cy="256" r="5" fill="#818cf8" />
  <circle cx="256" cy="446" r="5" fill="#38bdf8" />
  <circle cx="66" cy="256" r="5" fill="#818cf8" />
</svg>